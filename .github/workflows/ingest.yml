name: Ingest & index meetings

# Keeps the Typesense index fresh automatically. Runs once daily + on demand.
# This job pulls the feeds it can reach from GitHub's servers (including the browser
# pass for Cloudflare/JS-challenged feeds). A few feeds only respond to a residential
# IP — refresh those periodically from your own machine. The indexer's shrink-guard
# (INDEX_MIN_RATIO) prevents a partly-blocked run from wiping a much larger index.
on:
  schedule:
    - cron: "0 9 * * *"    # daily at 09:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write            # commit the refreshed coverage stats + ingest history back to main

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency: { group: ingest, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Headless browser so the scheduled run can also pull WAF/JS-challenged feeds.
      - name: Set up headless browser
        run: npm i playwright --no-save && npx playwright install --with-deps chromium

      # Pull every source in the registry → public/data/meetings.json
      - name: Ingest live feeds
        run: npm run ingest
        env:
          USE_BROWSER: "1"   # drive Chromium for Cloudflare/JS-challenged feeds
          GEOCODE: "1"       # fill missing coordinates via the US Census geocoder

      # Create/refresh the Typesense collection and import the documents.
      # Aborts (exit 1) if this run is < 70% the size of the live index — see index.mjs.
      - name: Index into Typesense
        run: npm run index
        env:
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
          NEXT_PUBLIC_TYPESENSE_COLLECTION: ${{ secrets.TYPESENSE_COLLECTION }}
          # INDEX_MIN_RATIO: "0.7"   # (default) minimum size vs. live index before aborting

      # Commit the SMALL derived data files so the site + the chatbot's honest-coverage list
      # track the daily index, instead of only refreshing on a manual local ingest. Pushing to
      # main triggers a Vercel redeploy that picks them up. No-op when nothing changed.
      #
      #   src/lib/fellowship-stats.json  (~200 B)  — which fellowships have meetings; the chatbot
      #                                              reads this to describe coverage honestly. This
      #                                              is the fix for the "coverage drift" bug: the
      #                                              browser-enabled CI ingest can surface feeds a
      #                                              browserless local run misses, so the bot stops
      #                                              punting on fellowships Typesense actually has.
      #   src/lib/data-history.json      (~300 B)  — the /studio growth chart's daily points.
      #
      # NOT committed here: public/data/meetings.json.gz (~8 MB, the dataset the Vercel BUILD reads
      # for the static coverage/city/fellowship pages). Committing an 8 MB binary daily would bloat
      # git history (~3 GB/yr; gz doesn't delta-compress). Keep refreshing it on your manual ingest
      # cadence. If you want the static pages auto-fresh too, uncomment the git add line below AND
      # move this job to a weekly schedule (e.g. cron "0 9 * * 1") to keep the bloat bounded.
      - name: Commit refreshed data files
        run: |
          git add src/lib/fellowship-stats.json src/lib/data-history.json
          # git add public/data/meetings.json.gz   # <- opt in for auto-fresh static pages (see note above)
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh coverage stats + ingest history [skip ci]"
          # The ingest runs ~25 min; main can advance while it works, which turns a plain push into a
          # non-fast-forward reject. Rebase our single derived-data commit onto the latest main and
          # retry, so a concurrent push doesn't fail the whole run.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."; exit 0
            fi
            echo "Push rejected (attempt $attempt) — rebasing onto origin/${GITHUB_REF_NAME:-main} and retrying."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME:-main}" || true
          done
          echo "Push still failing after 5 attempts."; exit 1

      # Ping IndexNow so Bing/Yandex/Seznam re-crawl the refreshed aggregate pages (hubs + every
      # problem + fellowship page, both locales) within minutes — the sitemap covers the long tail.
      # Non-fatal: the commit above triggers a Vercel redeploy and crawlers arrive minutes later, by
      # which time it's live. (First run may 403 until the public/<key>.txt file is deployed once.)
      - name: Ping IndexNow
        run: npm run indexnow
        continue-on-error: true

      # Keep a copy of the raw dataset as a build artifact
      - uses: actions/upload-artifact@v4
        with: { name: meetings-json, path: public/data/meetings.json, retention-days: 7 }

name: Ingest & index meetings

# Keeps the Typesense index fresh automatically. Runs once daily + on demand.
# This job pulls the feeds it can reach from GitHub's servers (including the browser
# pass for Cloudflare/JS-challenged feeds). A few feeds only respond to a residential
# IP — refresh those periodically from your own machine. The indexer's shrink-guard
# (INDEX_MIN_RATIO) prevents a partly-blocked run from wiping a much larger index.
on:
  schedule:
    - cron: "0 9 * * *"    # daily at 09:00 UTC
  workflow_dispatch: {}

jobs:
  ingest:
    runs-on: ubuntu-latest
    concurrency: { group: ingest, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci

      # Headless browser so the scheduled run can also pull WAF/JS-challenged feeds.
      - name: Set up headless browser
        run: npm i playwright --no-save && npx playwright install --with-deps chromium

      # Pull every source in the registry → public/data/meetings.json
      - name: Ingest live feeds
        run: npm run ingest
        env:
          USE_BROWSER: "1"   # drive Chromium for Cloudflare/JS-challenged feeds
          GEOCODE: "1"       # fill missing coordinates via the US Census geocoder

      # Create/refresh the Typesense collection and import the documents.
      # Aborts (exit 1) if this run is < 70% the size of the live index — see index.mjs.
      - name: Index into Typesense
        run: npm run index
        env:
          TYPESENSE_HOST: ${{ secrets.TYPESENSE_HOST }}
          TYPESENSE_PORT: ${{ secrets.TYPESENSE_PORT }}
          TYPESENSE_PROTOCOL: ${{ secrets.TYPESENSE_PROTOCOL }}
          TYPESENSE_ADMIN_API_KEY: ${{ secrets.TYPESENSE_ADMIN_API_KEY }}
          NEXT_PUBLIC_TYPESENSE_COLLECTION: ${{ secrets.TYPESENSE_COLLECTION }}
          # INDEX_MIN_RATIO: "0.7"   # (default) minimum size vs. live index before aborting

      # Keep a copy of the raw dataset as a build artifact
      - uses: actions/upload-artifact@v4
        with: { name: meetings-json, path: public/data/meetings.json, retention-days: 7 }
